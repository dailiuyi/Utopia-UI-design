<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" role="img" aria-label="Utopia UI Design Banner">
  <title>Utopia UI Design Hero</title>
  <style><![CDATA[
    .bg { fill: #091216; }
    .grid { stroke: #162a33; stroke-width: 1; stroke-dasharray: 4,4; }
    .panel { fill: #0f1f26; stroke: #1a3844; stroke-width: 1.5; }
    .badge { fill: #132832; stroke: #234d5d; stroke-width: 1; }
    .txt-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #10b981; letter-spacing: 0.12em; text-transform: uppercase; }
    .txt-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 38px; font-weight: 800; fill: #f0fdf4; letter-spacing: -0.02em; }
    .txt-desc { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.6; fill: #94a3b8; }
    .txt-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .telemetry-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; }
    .telemetry-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #10b981; }
    .code-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }

    /* Cyberpunk HUD Marks */
    .reticle-ring { stroke: #06b6d4; stroke-width: 1.5; fill: none; opacity: 0.6; }
    .reticle-cross { stroke: #10b981; stroke-width: 1.5; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f0fdfa; }
      .grid { stroke: #ccfbf1; }
      .panel { fill: #ffffff; stroke: #99f6e4; }
      .badge { fill: #f0fdf4; stroke: #a7f3d0; }
      .txt-tag { fill: #059669; }
      .txt-title { fill: #0f172a; }
      .txt-desc { fill: #334155; }
      .txt-sub { fill: #1e293b; }
      .telemetry-txt { fill: #64748b; }
      .telemetry-val { fill: #059669; }
      .code-txt { fill: #334155; }
      .reticle-ring { stroke: #0891b2; opacity: 0.6; }
      .reticle-cross { stroke: #059669; }
    }
  ]]></style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Grid -->
  <g class="grid">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="290" x2="1200" y2="290" />
  </g>

  <!-- Left: Content -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="280" height="26" rx="13" class="badge" />
    <circle cx="12" cy="13" r="4" fill="#10b981" />
    <text x="24" y="17" class="txt-tag">MR HUD DESIGN // GHOST IN THE SHELL</text>

    <text x="0" y="70" class="txt-title">Utopia-UI-design</text>
    <text x="0" y="106" class="txt-desc">面向 Unity 6 移动端 MR 决斗游戏的攻壳冷峻科技风 UI 设计复用套件。</text>
    <text x="0" y="132" class="txt-desc">1995 剧场版冷峻科技美学 · 设计 Token 结构化约束 · Agent Skill 开箱即用。</text>

    <!-- Pillars -->
    <g transform="translate(0, 168)">
      <g transform="translate(0, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#10b981" />
        <text x="32" y="25" class="txt-sub">冷黑青灰与电子绿功能性 HUD</text>
      </g>
      <g transform="translate(247, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#06b6d4" />
        <text x="32" y="25" class="txt-sub">竖屏准备校准 / 横屏沉浸战斗</text>
      </g>
      <g transform="translate(0, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#a78bfa" />
        <text x="32" y="25" class="txt-sub">Agent Skill 提示词与规范直接套用</text>
      </g>
      <g transform="translate(247, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#38bdf8" />
        <text x="32" y="25" class="txt-sub">标准 JSON 结构化 Design Tokens</text>
      </g>
    </g>

    <g transform="translate(0, 286)">
      <text x="0" y="0" class="telemetry-txt">UNITY 6 · MOBILE MR (IOS/ANDROID) · GIS 1995 PALETTE DERIVATIVE</text>
    </g>
  </g>

  <!-- Right: Cyberpunk HUD Crosshair Wireframe -->
  <g transform="translate(680, 40)">
    <rect width="460" height="280" rx="14" class="panel" />

    <!-- Header -->
    <line x1="0" y1="36" x2="460" y2="36" stroke="#162a33" class="grid" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="32" y="22" class="telemetry-txt">MR_SPATIAL_HUD // RETICLE_TRACKER</text>
    <rect x="375" y="10" width="65" height="18" rx="4" class="badge" />
    <text x="388" y="22" class="telemetry-val">LOCKED</text>

    <!-- Center Reticle Graphic -->
    <g transform="translate(230, 140)">
      <!-- Outer Dial -->
      <circle cx="0" cy="0" r="70" class="reticle-ring" stroke-dasharray="10,4" />
      <circle cx="0" cy="0" r="50" class="reticle-ring" />
      <circle cx="0" cy="0" r="25" class="reticle-ring" stroke-dasharray="4,2" />
      <circle cx="0" cy="0" r="4" fill="#10b981" />

      <!-- Cross lines -->
      <line x1="-80" y1="0" x2="-35" y2="0" class="reticle-cross" />
      <line x1="35" y1="0" x2="80" y2="0" class="reticle-cross" />
      <line x1="0" y1="-80" x2="0" y2="-35" class="reticle-cross" />
      <line x1="0" y1="35" x2="0" y2="80" class="reticle-cross" />

      <!-- Corner ticks -->
      <path d="M -50,-50 L -40,-50 L -50,-40" stroke="#06b6d4" stroke-width="1.5" fill="none" />
      <path d="M 50,-50 L 40,-50 L 50,-40" stroke="#06b6d4" stroke-width="1.5" fill="none" />
      <path d="M -50,50 L -40,50 L -50,40" stroke="#06b6d4" stroke-width="1.5" fill="none" />
      <path d="M 50,50 L 40,50 L 50,40" stroke="#06b6d4" stroke-width="1.5" fill="none" />
    </g>

    <!-- Side HUD readout -->
    <g transform="translate(20, 220)">
      <rect width="420" height="42" rx="6" class="badge" />
      <text x="14" y="24" class="telemetry-txt">SPATIAL RELOCATION:</text>
      <text x="156" y="24" class="telemetry-val">0.002m Drift / Tracking Active</text>
    </g>
  </g>
</svg>
